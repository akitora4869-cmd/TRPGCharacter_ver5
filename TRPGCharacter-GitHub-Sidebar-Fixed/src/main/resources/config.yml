# TRPGCharacter 設定

book:
  title: "探索者シート"
  author: "TRPG System"

# 能力値がまだ設定されていないプレイヤーの初期値
default-stat-value: 0

# /roll と本からの判定結果を全体チャットに表示するか
broadcast-rolls: true

# 入力できる能力値・技能値の範囲
input:
  min: 0
  max: 999

messages:
  prefix: "&6[TRPG]&r "


# 画面右側の個別ステータス表示
sidebar:
  enabled: true
  server-name: "TRPG Server"
  # 20tick = 1秒
  update-interval: 20
